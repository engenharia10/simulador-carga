<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#141414"/>
      <rect width="4" height="8" fill="#f2b100"/>
    </pattern>
  </defs>
  <rect width="64" height="64" rx="12" fill="#14171a"/>
  <!-- base / chassi zebrado -->
  <rect x="6" y="50" width="52" height="7" rx="1.5" fill="url(#hz)"/>
  <!-- coluna -->
  <rect x="12" y="30" width="8" height="21" rx="1.5" fill="#f2b100"/>
  <!-- lança principal (sobe) -->
  <path d="M14 33 L27 13 L33 17 L20 37 Z" fill="#f2b100"/>
  <!-- 2ª lança (horizontal, telescópica) -->
  <path d="M27 12 h28 a2 2 0 0 1 2 2 v4 a2 2 0 0 1 -2 2 h-28 Z" fill="#f2b100"/>
  <rect x="42" y="12" width="2" height="8" fill="#14171a" opacity=".55"/>
  <!-- articulação -->
  <circle cx="30" cy="16" r="3.2" fill="#14171a"/>
  <circle cx="30" cy="16" r="1.4" fill="#f2b100"/>
  <!-- cabo, gancho e carga -->
  <rect x="52.6" y="20" width="1.8" height="14" fill="#d8dde2"/>
  <rect x="48" y="34" width="11" height="10" rx="1.2" fill="#d8dde2"/>
  <rect x="48" y="38" width="11" height="1.6" fill="#14171a" opacity=".45"/>
</svg>
