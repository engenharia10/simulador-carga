<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulador de Guindaste Articulado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div><b>Simulador de carga</b><small>guindaste articulado · 3D</small></div>
    </div>
    <label class="model-plate">
      <span>Modelo</span>
      <select id="modelSelect" aria-label="Modelo da máquina"></select>
    </label>
    <p id="modelDesc" class="model-desc"></p>
    <nav class="views" id="views" aria-label="Câmera">
      <button data-view="3d">3D</button>
      <button data-view="lateral">Lateral</button>
      <button data-view="superior">Superior</button>
      <button data-view="operador">Operador</button>
      <button data-view="gancho">Seguir gancho</button>
    </nav>
  </header>

  <main class="stage">
    <div class="view-wrap">
      <div id="viewport"></div>
      <section class="panel quick" id="quick" aria-label="Comando rápido das lanças">
        <header><span>Comando rápido</span><button class="mini" id="quickToggle" title="Recolher / expandir">–</button></header>
        <div class="quick-status">
          <div class="ro wide"><label>Momento atual / nominal</label><output id="roMoment">0</output><i>/</i><output id="roMomentRated" class="dim">—</output><i>kgf·m</i></div>
          <div class="util">
            <div class="util-head"><label>Utilização</label><output id="roUtil">0%</output></div>
            <div class="util-bar"><div id="utilFill"></div><span class="tick" style="left:75%" title="90%"></span><span class="tick hard" style="left:83.333%" title="100%"></span></div>
          </div>
          <div class="flags" id="flags"></div>
        </div>
        <div class="quick-body" id="quickBody"></div>
      </section>
    </div>

    <aside class="panel controls" id="controls" aria-label="Comandos"></aside>

    <section class="panel hud" id="hud" aria-label="Indicadores">
      <div class="hud-grid">
        <div class="ro"><label>Raio</label><output id="roRadius">0.00</output><i>m</i></div>
        <div class="ro"><label>Ângulo ponta</label><output id="roAngle">0.0</output><i>°</i></div>
        <div class="ro"><label>Altura gancho</label><output id="roHeight">0.00</output><i>m</i></div>
        <div class="ro"><label>Altura ponta</label><output id="roTip">0.00</output><i>m</i></div>
        <div class="ro big"><label>Capacidade <small id="roCapNote"></small></label><output id="roCap">—</output><i>kg</i></div>
        <div class="ro big load"><label>Carga <small id="roLoadNote"></small></label><output id="roLoad">0</output><i>kg</i></div>
      </div>
    </section>

    <section class="panel diagram" aria-label="Diagrama de carga">
      <header><span>Diagrama de carga</span><button id="btnChartImg" class="mini" hidden>ver original</button></header>
      <div class="diagram-body">
        <canvas id="diagram"></canvas>
        <img id="chartImg" alt="Diagrama de carga original" hidden>
      </div>
    </section>

    <div class="alarm" id="alarm" role="alert" hidden><span id="alarmText"></span></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- modelos de máquinas: um arquivo por modelo -->
  <script src="js/models/registry.js"></script>
  <script src="js/models/s293.js"></script>
  <script src="js/models/exemplo-jib.js"></script>

  <script src="js/kinematics.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/diagram.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
